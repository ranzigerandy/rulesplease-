<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rules Please!</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="design-system.css">
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <div class="brand">
        <div class="brand-lockup">
          <img class="brand-mascot" src="assets/rulesplease-mascot.png" alt="Rules Please! mascot">
          <div>
            <h1>Rules Please!</h1>
            <p class="muted">rulesplease.com</p>
          </div>
        </div>
        <button class="icon-btn" id="railSettings" title="Settings" aria-label="Settings">
          <svg class="lucide" viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.37a1.7 1.7 0 0 0-1 .63V20a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-.63 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.63 15a1.7 1.7 0 0 0-.63-1H4a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 .63-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.63a1.7 1.7 0 0 0 1-.63V4a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 .63 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.37 9c.25.36.46.72.63 1H20a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-.51 1Z"/></svg>
        </button>
      </div>
      <div class="scroll stack" id="chatList"></div>
      <button class="primary" id="railNewChat">
        <svg class="lucide" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        New chat
      </button>
    </aside>

    <main class="viewport">
      <div class="phone" id="app"></div>
    </main>
  </div>

  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sourceSheet" aria-live="polite"></section>

  <script>
    const state = {
      games: [],
      messages: {},
      selectedId: null,
      view: "chats",
      asking: false,
      askTimer: null,
      searchResults: [],
      searchQuery: "",
      activeCitations: [],
      viewerCitation: null
    };

    const app = document.querySelector("#app");
    const chatList = document.querySelector("#chatList");
    const sourceSheet = document.querySelector("#sourceSheet");
    const scrim = document.querySelector("#scrim");

    document.querySelector("#railNewChat").addEventListener("click", () => go("new"));
    document.querySelector("#railSettings").addEventListener("click", () => go("settings"));
    scrim.addEventListener("click", closeSources);

    function currentGame() {
      return state.games.find((game) => game.id === state.selectedId) || null;
    }

    function go(view, id) {
      if (id != null) state.selectedId = Number(id);
      state.view = view;
      closeSources();
      render();
    }

    function statusClass(status) {
      if (status === "ready") return "ready";
      if (status === "review_required" || status === "rulebook_not_found") return "review";
      return "working";
    }

    function formatRank(rank) {
      return rank ? `#${Number(rank).toLocaleString("en-US")}` : "Unranked";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderMarkdown(value) {
      let text = escapeHtml(value || "");
      text = text.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
      text = text.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
      text = text.replace(/`([^`\n]+)`/g, "<code>$1</code>");
      text = text.replace(/\n{2,}/g, "</p><p>");
      text = text.replace(/\n/g, "<br>");
      return `<p>${text}</p>`;
    }

    function icon(name) {
      const paths = {
        "arrow-left": `<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>`,
        "book-open": `<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>`,
        "clock": `<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>`,
        "external-link": `<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>`,
        "file-text": `<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/>`,
        "info": `<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>`,
        "message-circle": `<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/>`,
        "plus": `<path d="M5 12h14"/><path d="M12 5v14"/>`,
        "search": `<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>`,
        "send": `<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>`,
        "settings": `<path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.37a1.7 1.7 0 0 0-1 .63V20a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-.63 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.63 15a1.7 1.7 0 0 0-.63-1H4a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 .63-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.63a1.7 1.7 0 0 0 1-.63V4a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 .63 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.37 9c.25.36.46.72.63 1H20a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-.51 1Z"/>`,
        "user-round": `<circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/>`,
        "trash-2": `<path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6 18 20a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>`,
        "x": `<path d="M18 6 6 18"/><path d="m6 6 12 12"/>`
      };
      return `<svg class="lucide" viewBox="0 0 24 24" aria-hidden="true">${paths[name] || paths.info}</svg>`;
    }

    async function api(path, options = {}) {
      const response = await fetch(path, {
        headers: { "Content-Type": "application/json" },
        ...options
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    async function loadState(keepSelection = true) {
      const data = await api("/api/my-games");
      state.games = data.games || [];
      state.messages = data.messages || {};
      if (!keepSelection || !state.games.some((game) => game.id === state.selectedId)) {
        state.selectedId = state.games[0]?.id || null;
      }
      render();
    }

    function render() {
      renderRail();
      const game = currentGame();
      if (state.view === "new") return renderNewChat();
      if (state.view === "search") return renderSearch();
      if (state.view === "setup") return renderSetup(game);
      if (state.view === "chat") return renderChat(game);
      if (state.view === "details") return renderDetails(game);
      if (state.view === "viewer") return renderViewer(game);
      if (state.view === "settings") return renderSettings();
      return renderChats();
    }

    function renderRail() {
      if (!state.games.length) {
        chatList.innerHTML = `<div class="empty">No chats yet.</div>`;
        return;
      }
      chatList.innerHTML = state.games.map((game) => {
        const messages = state.messages[String(game.id)] || [];
        const last = [...messages].reverse().find((item) => item.role === "assistant" || item.role === "user");
        return `
          <button class="conversation ${game.id === state.selectedId ? "active" : ""}" data-open-chat="${game.id}">
            ${gameThumbnail(game)}
            <div>
              <strong>${escapeHtml(game.name)}</strong>
              <p class="muted">${escapeHtml(last?.text || game.statusMessage || "New rules chat")}</p>
            </div>
          </button>
        `;
      }).join("");
      chatList.querySelectorAll("[data-open-chat]").forEach((button) => {
        button.addEventListener("click", () => openGame(Number(button.dataset.openChat)));
      });
    }

    function topBar(title, subtitle, backView = "chats", actions = "") {
      return `
        <header class="top">
          <button class="icon-btn" data-go="${backView}" title="Back" aria-label="Back">${icon("arrow-left")}</button>
          <div class="top-title">
            <h3>${escapeHtml(title)}</h3>
            <p class="muted">${escapeHtml(subtitle || "")}</p>
          </div>
          ${actions || `<span style="width:44px"></span>`}
        </header>
      `;
    }

    function chatTopBar(game) {
      return `
        <header class="top chat-top">
          <button class="icon-btn chat-back" data-go="chats" title="Back" aria-label="Back">${icon("arrow-left")}</button>
          ${gameThumbnail(game, "game-thumbnail--header")}
          <div class="chat-top-title"><h3>${escapeHtml(game.name)}</h3></div>
          <button class="icon-btn chat-details" data-go="details" title="Details" aria-label="Details">${icon("info")}</button>
        </header>
      `;
    }

    function renderChats() {
      app.innerHTML = `
        <section class="screen">
          <header class="top chats-top">
            <span aria-hidden="true"></span>
            <button class="icon-btn" data-go="settings" title="Settings" aria-label="Settings">${icon("settings")}</button>
          </header>
          <div class="content chats-page">
            <div class="chats-mascot-hero">
              <p class="chats-welcome">Hi Karel!</p>
              <div class="chats-mascot-figure">
                <img class="brand-mascot" src="assets/rulesplease-mascotte.png" alt="Rules Please! mascot">
              </div>
            </div>
            <section class="chats-actions">
              <label class="chat-search" for="chatFilter">
                ${icon("search")}
                <input id="chatFilter" type="search" autocomplete="off" placeholder="Search chats..." aria-label="Search chats">
              </label>
              <button class="primary chats-new" data-go="new">${icon("plus")} Start a new rules chat</button>
            </section>
            <section class="chats-list">
              <h3>Recent chats</h3>
              ${state.games.length ? state.games.map(chatRow).join("") : `<div class="empty"><strong>No chats yet</strong><span>Create a chat by choosing a game.</span></div>`}
            </section>
          </div>
          ${mobileTabs()}
        </section>
      `;
      bindCommon();
      app.querySelectorAll("[data-open-chat]").forEach((button) => {
        button.addEventListener("click", () => openGame(Number(button.dataset.openChat)));
      });
      app.querySelector("#chatFilter")?.addEventListener("input", (event) => {
        const query = normalizeChatText(event.target.value);
        app.querySelectorAll("[data-chat-name]").forEach((row) => {
          row.hidden = Boolean(query) && !row.dataset.chatName.includes(query);
        });
      });
    }

    function chatRow(game) {
      const messages = state.messages[String(game.id)] || [];
      const last = [...messages].reverse().find((item) => item.role === "assistant" || item.role === "user");
      return `
        <button class="conversation chat-card" data-open-chat="${game.id}" data-chat-name="${escapeHtml(normalizeChatText(game.name))}">
          ${gameThumbnail(game, "game-thumbnail--chat")}
          <div class="chat-card-body">
            <strong>${escapeHtml(game.name)}</strong>
            <p class="muted">${escapeHtml(last?.text || game.statusMessage || "No messages yet")}</p>
            <p class="chat-activity">${escapeHtml(relativeTime(game.updatedAt || game.addedAt))}</p>
          </div>
        </button>
      `;
    }

    function renderNewChat() {
      app.innerHTML = `
        <section class="screen">
          ${topBar("New chat", "Choose how to start", "chats")}
          <div class="content stack">
            <section class="hero">
              <h2>What are you playing?</h2>
              <p class="muted">A chat is linked to one game and one indexed rulebook.</p>
            </section>
            <div class="quick-grid">
              <button class="tile" data-go="search">
                <span class="tile-mark">${icon("search")}</span>
                <div><h3>Search game</h3><p class="muted">Find a base game in the BGG catalog.</p></div>
              </button>
              <button class="tile" data-go="chats">
                <span class="tile-mark">${icon("clock")}</span>
                <div><h3>Recent chats</h3><p class="muted">Continue a saved rules conversation.</p></div>
              </button>
            </div>
            ${state.games.length ? `<section class="stack"><p class="eyebrow">Recent</p>${state.games.slice(0, 4).map(chatRow).join("")}</section>` : ""}
          </div>
          ${mobileTabs()}
        </section>
      `;
      bindCommon();
      app.querySelectorAll("[data-open-chat]").forEach((button) => {
        button.addEventListener("click", () => openGame(Number(button.dataset.openChat)));
      });
    }

    function renderSearch() {
      app.innerHTML = `
        <section class="screen">
          ${topBar("Game search", "BoardGameGeek catalog", "new")}
          <div class="content stack">
            <form class="search" id="searchForm">
              <input id="searchInput" type="search" autocomplete="off" placeholder="Search a board game" value="${escapeHtml(state.searchQuery)}">
              <button class="primary">${icon("search")} Search</button>
            </form>
            <div class="stack" id="searchResults">
              ${renderSearchResults()}
            </div>
          </div>
        </section>
      `;
      bindCommon();
      const input = app.querySelector("#searchInput");
      const form = app.querySelector("#searchForm");
      input.focus();
      input.addEventListener("input", debounce(() => {
        state.searchQuery = input.value.trim();
        searchGames(false);
      }, 220));
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        state.searchQuery = input.value.trim();
        searchGames(true);
      });
      bindAddButtons();
    }

    function renderSearchResults() {
      if (!state.searchQuery) {
        return `<div class="empty"><strong>Search by title</strong><span>Type at least two characters.</span></div>`;
      }
      if (!state.searchResults.length) {
        return `<div class="empty"><strong>No results yet</strong><span>Try a more specific game title.</span></div>`;
      }
      return state.searchResults.map((game) => `
        <article class="result">
          ${gameThumbnail(game, "game-thumbnail--result")}
          <div>
            <h3>${escapeHtml(game.name)}</h3>
            <div class="meta">
              <span>${game.year || "-"}</span>
              <span>${formatRank(game.rank)}</span>
              <span>${Number(game.users || 0).toLocaleString("en-US")} ratings</span>
              <span>BGG ${game.id}</span>
            </div>
          </div>
          <button class="primary" data-add="${game.id}">${icon("message-circle")} Start</button>
        </article>
      `).join("");
    }

    async function searchGames(force) {
      const box = app.querySelector("#searchResults");
      if (state.searchQuery.length < 2) {
        state.searchResults = [];
        if (box) box.innerHTML = renderSearchResults();
        return;
      }
      if (box && force) box.innerHTML = `<div class="empty">Searching...</div>`;
      try {
        const data = await api(`/api/search?q=${encodeURIComponent(state.searchQuery)}&baseOnly=true`);
        state.searchResults = data.results || [];
        if (box) box.innerHTML = renderSearchResults();
        bindAddButtons();
      } catch (error) {
        if (box) box.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
      }
    }

    function bindAddButtons() {
      app.querySelectorAll("[data-add]").forEach((button) => {
        button.addEventListener("click", () => addGame(Number(button.dataset.add)));
      });
    }

    async function addGame(id) {
      const data = await api("/api/my-games", { method: "POST", body: JSON.stringify({ id }) });
      state.selectedId = data.game.id;
      state.searchQuery = "";
      state.searchResults = [];
      await loadState(true);
      go(data.game.status === "ready" ? "chat" : "setup", data.game.id);
    }

    function openGame(id) {
      const game = state.games.find((item) => item.id === id);
      go(game?.status === "ready" ? "chat" : "setup", id);
    }

    function renderSetup(game) {
      if (!game) return renderChats();
      const ready = game.status === "ready";
      app.innerHTML = `
        <section class="screen">
          ${topBar(game.name, "Rulebook setup", "chats", `<button class="icon-btn" data-go="details" title="Details" aria-label="Details">${icon("info")}</button>`)}
          <div class="content stack">
            <section class="setup-panel">
              <span class="chip ${statusClass(game.status)}">${escapeHtml(game.statusLabel)}</span>
              <div>
                <h2>${ready ? "Rulebook ready" : "Preparing chat"}</h2>
                <p class="muted">${escapeHtml(game.statusMessage || "Rulebook discovery is running.")}</p>
              </div>
              <div class="progress"><div class="bar" style="width:${Number(game.progress || 0)}%"></div></div>
              <div class="meta">
                <span>BGG ${game.id}</span>
                <span>${game.year || "-"}</span>
                <span>${game.pageCount || 0} pages</span>
                <span>${game.chunkCount || 0} passages</span>
              </div>
              <button class="primary" data-go="chat" ${ready ? "" : "disabled"}>${icon("message-circle")} Open chat</button>
            </section>
          </div>
          ${mobileTabs()}
        </section>
      `;
      bindCommon();
    }

    function renderChat(game) {
      if (!game) return renderChats();
      const messages = state.messages[String(game.id)] || [];
      const ready = game.status === "ready";
      app.innerHTML = `
        <section class="screen">
          ${chatTopBar(game)}
          <div class="content" id="messagePane">
            <div class="messages">
              ${messages.length ? messages.map((message, index) => renderMessage(message, index)).join("") : `<div class="empty"><strong>Ask a rules question</strong><span>Answers will include rulebook sources when available.</span></div>`}
            </div>
          </div>
          <footer class="footer">
            <form class="composer" id="chatForm">
              <input id="question" type="text" autocomplete="off" ${ready && !state.asking ? "" : "disabled"} placeholder="${ready ? "Ask about the rules" : "Waiting for rulebook"}">
              <button class="primary" ${ready && !state.asking ? "" : "disabled"}>${state.asking ? icon("message-circle") : icon("send")} ${state.asking ? "Thinking" : "Ask"}</button>
            </form>
          </footer>
        </section>
      `;
      bindCommon();
      app.querySelector("#chatForm").addEventListener("submit", (event) => askQuestion(event, game.id));
      app.querySelectorAll("[data-sources]").forEach((button) => {
        button.addEventListener("click", () => {
          const idx = Number(button.dataset.sources);
          const msg = messages[idx];
          openSources(msg?.citations || []);
        });
      });
      const pane = app.querySelector("#messagePane");
      pane.scrollTop = pane.scrollHeight;
    }

    function renderMessage(message, index) {
      if (message.role === "user") {
        return `<div class="bubble user">${escapeHtml(message.text)}</div>`;
      }
      const count = (message.citations || []).length;
      return `
        <div class="bubble assistant ${message.streaming ? "typing" : ""}" data-message-index="${index}">
          <div class="answer-text">${renderMarkdown(message.text || "")}</div>
          ${count ? `<div class="bubble-actions"><button class="source-link" data-sources="${index}">${count} sources</button></div>` : ""}
        </div>
      `;
    }

    async function askQuestion(event, id) {
      event.preventDefault();
      if (state.asking) return;
      const input = app.querySelector("#question");
      const question = input.value.trim();
      if (!question) return;
      input.value = "";
      state.asking = true;
      const key = String(id);
      state.messages[key] = state.messages[key] || [];
      state.messages[key].push({ role: "user", text: question });
      state.messages[key].push({ role: "assistant", text: "", citations: [], streaming: true });
      const assistantIndex = state.messages[key].length - 1;
      render();
      startAskFeedback();
      try {
        await streamQuestion(id, key, assistantIndex, question);
      } catch (error) {
        state.messages[key].splice(assistantIndex, 1);
        state.messages[key].push({ role: "assistant", text: error.message, citations: [] });
      } finally {
        const message = state.messages[key]?.[assistantIndex];
        if (message) message.streaming = false;
        state.asking = false;
        stopAskFeedback();
        render();
      }
    }

    async function streamQuestion(id, key, assistantIndex, question) {
      const response = await fetch(`/api/games/${id}/ask-stream`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question })
      });
      if (!response.ok || !response.body) throw new Error("Could not start AI answer stream.");

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const events = buffer.split("\n\n");
        buffer = events.pop() || "";
        for (const eventBlock of events) {
          const result = handleStreamEvent(eventBlock, key, assistantIndex);
          if (result === "done") {
            await reader.cancel();
            return;
          }
        }
      }
      if (buffer.trim()) handleStreamEvent(buffer, key, assistantIndex);
    }

    function handleStreamEvent(block, key, assistantIndex) {
      let eventName = "message";
      let dataText = "";
      for (const line of block.split("\n")) {
        if (line.startsWith("event:")) eventName = line.slice(6).trim();
        if (line.startsWith("data:")) dataText += line.slice(5).trim();
      }
      if (!dataText) return;
      const data = JSON.parse(dataText);
      const message = state.messages[key]?.[assistantIndex];
      if (!message) return;

      if (eventName === "sources") {
        message.citations = data.citations || [];
      } else if (eventName === "delta") {
        message.text += data.text || "";
        updateStreamingMessage(assistantIndex, message.text);
      } else if (eventName === "done") {
        message.text = data.answer || message.text;
        message.citations = data.citations || message.citations || [];
        message.streaming = false;
        return "done";
      } else if (eventName === "error") {
        throw new Error(data.message || "AI answer failed.");
      }
      return eventName;
    }

    function updateStreamingMessage(index, text) {
      const node = document.querySelector(`[data-message-index="${index}"] .answer-text`);
      if (node) node.innerHTML = renderMarkdown(text);
      const pane = app.querySelector("#messagePane");
      if (pane) pane.scrollTop = pane.scrollHeight;
    }

    function openSources(citations) {
      state.activeCitations = citations;
      sourceSheet.innerHTML = `
        <div class="stack">
          <div class="brand">
            <div><p class="eyebrow">Sources</p><h3>Rulebook passages</h3></div>
            <button class="icon-btn" id="closeSources" title="Close" aria-label="Close">${icon("x")}</button>
          </div>
          ${citations.length ? citations.map((citation, index) => `
            <article class="source-card">
              <div class="brand">
                <strong>Page ${escapeHtml(citation.page)}</strong>
                <button class="secondary" data-viewer="${index}">${icon("book-open")} Open</button>
              </div>
              <p class="muted">${escapeHtml(citation.quote)}</p>
              <p class="muted">${escapeHtml(citation.sourceLabel || "Rulebook")}</p>
            </article>
          `).join("") : `<div class="empty">No source passages for this answer.</div>`}
        </div>
      `;
      sourceSheet.classList.add("open");
      scrim.classList.add("open");
      sourceSheet.querySelector("#closeSources").addEventListener("click", closeSources);
      sourceSheet.querySelectorAll("[data-viewer]").forEach((button) => {
        button.addEventListener("click", () => {
          state.viewerCitation = citations[Number(button.dataset.viewer)];
          closeSources();
          go("viewer");
        });
      });
    }

    function closeSources() {
      sourceSheet.classList.remove("open");
      scrim.classList.remove("open");
    }

    function renderViewer(game) {
      if (!game) return renderChats();
      const citation = state.viewerCitation;
      const page = citation?.page || 1;
      const link = game.pdfUrl ? `${game.pdfUrl}#page=${page}` : citation?.sourceUrl;
      app.innerHTML = `
        <section class="screen">
          ${topBar("Rulebook", `Page ${page}`, "chat", link ? `<a class="icon-btn" href="${escapeHtml(link)}" target="_blank" rel="noreferrer" title="Open" aria-label="Open rulebook">${icon("external-link")}</a>` : "")}
          <div class="content stack">
            ${link ? `<iframe class="viewer-frame" src="${escapeHtml(link)}"></iframe>` : `<div class="empty">No rulebook file available.</div>`}
            ${citation ? `<article class="source-card"><strong>Passage</strong><p class="muted">${escapeHtml(citation.quote)}</p></article>` : ""}
          </div>
        </section>
      `;
      bindCommon();
    }

    function renderDetails(game) {
      if (!game) return renderChats();
      const rulebookLink = game.pdfUrl || game.sourceUrl;
      app.innerHTML = `
        <section class="screen">
          ${topBar("Chat details", game.name, game.status === "ready" ? "chat" : "setup")}
          <div class="content stack">
            <section class="setup-panel">
              ${gameThumbnail(game, "game-thumbnail--detail")}
              <div>
                <h2>${escapeHtml(game.name)}</h2>
                <p class="muted">BGG ${game.id} &middot; ${game.year || "-"} &middot; ${formatRank(game.rank)}</p>
              </div>
              <span class="chip ${statusClass(game.status)}">${escapeHtml(game.statusLabel)}</span>
              <p class="muted">${escapeHtml(game.statusMessage || "")}</p>
            </section>
            <div class="setting-row"><div><h3>Rulebook source</h3><p class="muted">${escapeHtml(game.sourceUrl || "Not available yet")}</p></div>${rulebookLink ? `<a class="secondary" href="${escapeHtml(rulebookLink)}" target="_blank" rel="noreferrer">${icon("external-link")} Open</a>` : ""}</div>
            <div class="setting-row"><div><h3>Index</h3><p class="muted">${game.pageCount || 0} pages &middot; ${game.chunkCount || 0} passages &middot; ${game.aiSearch || "pending"}</p></div><span></span></div>
            <button class="danger-btn" id="removeGame">${icon("trash-2")} Delete chat</button>
          </div>
        </section>
      `;
      bindCommon();
      app.querySelector("#removeGame").addEventListener("click", () => removeGame(game.id));
    }

    async function removeGame(id) {
      await api(`/api/my-games/${id}`, { method: "DELETE" });
      state.selectedId = null;
      await loadState(false);
      go("chats");
    }

    function renderSettings() {
      app.innerHTML = `
        <section class="screen">
          ${topBar("Settings", "", "chats")}
          <div class="content stack settings-page">
            <section class="account-card">
              <div class="account-avatar"><img class="brand-mascot" src="assets/rulesplease-mascot.png" alt="Rules Please! mascot"></div>
              <div>
                <h3>Rules Please!</h3>
                <p class="muted">rulesplease.com</p>
              </div>
            </section>

            <section class="settings-section">
              <p class="settings-section-title">Account</p>
              <div class="settings-list">
                <div class="settings-item">
                  <h3>Subscription</h3>
                  <span class="settings-value">Local MVP <span class="chevron"></span></span>
                </div>
                <div class="settings-item">
                  <h3>Email</h3>
                  <span class="settings-value">Not signed in</span>
                </div>
              </div>
            </section>

            <section class="settings-section">
              <p class="settings-section-title">App</p>
              <div class="settings-list">
                <div class="settings-item">
                  <h3>Language</h3>
                  <span class="settings-value">Auto <span class="chevron"></span></span>
                </div>
                <div class="settings-item">
                  <h3>Answer with citations</h3>
                  <span class="switch on" aria-label="On"></span>
                </div>
                <div class="settings-item">
                  <h3>Search mode</h3>
                  <span class="settings-value">${escapeHtml(searchModeLabel())} <span class="chevron"></span></span>
                </div>
              </div>
            </section>

            <section class="settings-section">
              <p class="settings-section-title">Data</p>
              <div class="settings-list">
                <div class="settings-item">
                  <h3>Chats</h3>
                  <span class="settings-value">${state.games.length}</span>
                </div>
                <div class="settings-item">
                  <h3>Rulebooks</h3>
                  <span class="settings-value">${state.games.filter((game) => game.pdfUrl || game.sourceUrl).length}</span>
                </div>
                <div class="settings-item">
                  <h3>Data controls</h3>
                  <span class="settings-value"><span class="chevron"></span></span>
                </div>
              </div>
            </section>

            <section class="settings-section">
              <p class="settings-section-title">Support</p>
              <div class="settings-list">
                <div class="settings-item">
                  <h3>Report wrong citation</h3>
                  <span class="settings-value"><span class="chevron"></span></span>
                </div>
                <div class="settings-item">
                  <h3>About Rules Please!</h3>
                  <span class="settings-value"><span class="chevron"></span></span>
                </div>
              </div>
            </section>
          </div>
          ${mobileTabs()}
        </section>
      `;
      bindCommon();
    }

    function mobileTabs() {
      return `
        <footer class="footer mobile-tabs chat-bottom-nav">
          <button class="chat-nav-item ${state.view === "chats" ? "active" : ""}" data-go="chats">${icon("message-circle")}<span>Chats</span></button>
          <button class="chat-nav-item" data-go="new">${icon("search")}<span>Add game</span></button>
          <button class="chat-nav-item" data-go="chats">${icon("book-open")}<span>Rulebooks</span></button>
          <button class="chat-nav-item ${state.view === "settings" ? "active" : ""}" data-go="settings">${icon("user-round")}<span>Profile</span></button>
        </footer>
      `;
    }

    function bindCommon() {
      app.querySelectorAll("[data-go]").forEach((button) => {
        button.addEventListener("click", () => go(button.dataset.go));
      });
    }

    function initials(name) {
      return String(name || "?").split(/\s+/).filter(Boolean).slice(0, 2).map((part) => part[0]).join("").toUpperCase();
    }

    function gameThumbnail(game, modifier = "") {
      const classes = ["game-thumbnail", modifier].filter(Boolean).join(" ");
      const id = Number(game?.id);
      const label = escapeHtml(`${game?.name || "Board game"} cover`);
      if (!Number.isInteger(id) || id <= 0) {
        return `<span class="${classes}" aria-hidden="true"><span class="game-thumbnail-fallback">${escapeHtml(initials(game?.name))}</span></span>`;
      }
      return `<span class="${classes}"><span class="game-thumbnail-fallback" aria-hidden="true">${escapeHtml(initials(game.name))}</span><img src="/api/games/${id}/thumbnail" alt="${label}" loading="lazy" onerror="this.remove()"></span>`;
    }

    function relativeTime(value) {
      const timestamp = new Date(value || 0).getTime();
      if (!Number.isFinite(timestamp) || timestamp <= 0) return "Recently";
      const days = Math.floor(Math.max(0, Date.now() - timestamp) / 86400000);
      if (days === 0) return "Today";
      if (days === 1) return "Yesterday";
      if (days < 7) return `${days} days ago`;
      const weeks = Math.floor(days / 7);
      return weeks === 1 ? "1 week ago" : `${weeks} weeks ago`;
    }

    function normalizeChatText(value) {
      return String(value || "").toLocaleLowerCase().replace(/\s+/g, " ").trim();
    }

    function searchModeLabel() {
      return state.games.some((game) => game.aiSearch === "embeddings") ? "AI" : "Keyword";
    }

    function startAskFeedback() {
      clearInterval(state.askTimer);
      state.askTimer = setInterval(() => {}, 700);
    }

    function stopAskFeedback() {
      clearInterval(state.askTimer);
      state.askTimer = null;
    }

    function debounce(fn, wait) {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), wait);
      };
    }

    loadState(false);
    setInterval(() => {
      const working = state.games.some((game) => !["ready", "review_required", "rulebook_not_found"].includes(game.status));
      if (working) loadState(true);
    }, 1500);
  </script>
</body>
</html>
